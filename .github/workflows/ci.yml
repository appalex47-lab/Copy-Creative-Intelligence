# CI de Copy Creative Intelligence (S1.11).
# - Se ejecuta en pull requests, en push a main y a development/**, y manualmente.
# - Solo lectura del repositorio; no usa credenciales ni secretos, no se conecta a servicios externos y no despliega.
# - Las acciones están ancladas por SHA de commit (checkout v7.0.1, setup-node v7.1.0); actualizarlas es un cambio deliberado.
name: CI

on:
  pull_request:
  push:
    branches: ['main', 'development/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Calidad estática, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Instalación reproducible (lockfile)
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint (incluye scripts y configuración)
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Pruebas unitarias, de componentes, arquitectura (AST) y secretos
        run: npm run test:run
      - name: Control de secretos
        run: npm run check:secrets
      - name: Build (modo preview con datos DEMO)
        run: npm run build
      - name: Guarda de producción (debe FALLAR con DEMO, incluido el valor por defecto)
        run: |
          if npm run build:production; then
            echo "ERROR: un build de producción con DEMO no debe tener éxito" && exit 1
          fi
      - name: Build de producción en modo local (debe funcionar)
        run: VITE_DATA_MODE=local npm run build:production

  e2e:
    name: Navegador real (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Usa el Google Chrome del runner (channel "chrome"); no descarga navegadores.
      - name: Pruebas e2e, accesibilidad y responsive
        run: npm run test:e2e
        env:
          CI: 'true'
