# Publicación en GitHub Pages (decisión del propietario sobre P10: todo se aloja en GitHub Pages).
# - Es MANUAL (workflow_dispatch): no despliega solo en cada push. Requiere que en Settings → Pages la fuente sea
#   "GitHub Actions" (lo configura el propietario).
# - Construye el modo de producción con datos LOCALES del navegador (sin DEMO, sin backend, sin secretos).
name: Publicar en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verificación completa antes de publicar
        run: npm run verify
      - name: Build de producción (modo local, ruta relativa)
        run: VITE_DATA_MODE=local npm run build:production
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
